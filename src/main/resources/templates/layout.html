<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <title>Pokemon TCG Collection</title>
    <link rel="icon" type="image/svg+xml" href="/images/pokeball-favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .navbar-brand {
            font-weight: bold;
            color: #ff6b35 !important;
        }
        .card-img-top {
            height: 200px;
            object-fit: contain;
        }
        .pokemon-card {
            transition: transform 0.2s;
        }
        .pokemon-card:hover {
            transform: scale(1.05);
        }
        .owned-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #28a745;
            color: white;
            border-radius: 999px;
            min-width: 30px;
            height: 30px;
            padding: 0 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        .compact-pagination .pagination {
            flex-wrap: wrap;
            gap: 0.25rem;
        }
        .compact-pagination .page-link {
            min-width: 2.35rem;
            padding: 0.45rem 0.7rem;
            text-align: center;
        }
        .page-jump-form {
            align-items: center;
        }
        .page-jump-label {
            margin-bottom: 0;
            white-space: nowrap;
        }
        .page-jump-input {
            width: 5.25rem;
        }
        .mobile-stack-md {
            display: flex;
        }
        .mobile-inline-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .mobile-inline-actions > * {
            flex: 0 0 auto;
        }
        @media (max-width: 576px) {
            .compact-pagination .pagination {
                justify-content: center;
            }
            .compact-pagination .page-link {
                min-width: 2rem;
                padding: 0.35rem 0.55rem;
                font-size: 0.9rem;
            }
            .compact-pagination .page-item:first-child .page-link,
            .compact-pagination .page-item:last-child .page-link {
                padding-left: 0.6rem;
                padding-right: 0.6rem;
            }
            .page-jump-form {
                row-gap: 0.5rem;
            }
            .page-jump-label {
                font-size: 0.9rem;
            }
            .page-jump-input {
                width: 4.5rem;
            }
            .page-jump-button {
                padding-left: 0.75rem;
                padding-right: 0.75rem;
            }
        }
        @media (max-width: 767.98px) {
            .mobile-stack-md {
                flex-direction: column !important;
                align-items: stretch !important;
            }
            .mobile-stack-md > .mobile-stack-item,
            .mobile-stack-md > * {
                width: 100%;
            }
            .mobile-inline-actions {
                width: 100%;
            }
            .mobile-inline-actions > * {
                flex: 1 1 100%;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-dragon"></i> Pokemon TCG Collection
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">
                            <i class="fas fa-house"></i> Accueil
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/browse">
                            <i class="fas fa-search"></i> Parcourir
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/sets">
                            <i class="fas fa-cubes"></i> Ensembles
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" href="/collection">
                            <i class="fas fa-book"></i> Ma Collection
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" href="/pokedex">
                            <i class="fas fa-list"></i> Pokedex
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" href="/dashboard">
                            <i class="fas fa-tachometer-alt"></i> Dashboard
                        </a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link" href="/login">Connexion</a>
                    </li>
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link" href="/register">Inscription</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <form class="d-inline" th:action="@{/logout}" method="post">
                            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-link nav-link">
                                <i class="fas fa-sign-out-alt"></i> Déconnexion
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4" layout:fragment="content">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        function withCsrf(init) {
            const requestInit = init ? { ...init } : {};
            const token = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
            const headerName = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');
            const headers = new Headers(requestInit.headers || {});

            if (token && headerName && !headers.has(headerName)) {
                headers.set(headerName, token);
            }

            requestInit.headers = headers;
            if (!requestInit.credentials) {
                requestInit.credentials = 'same-origin';
            }
            return requestInit;
        }
    </script>
    <th:block layout:fragment="scripts"></th:block>
</body>
</html>
