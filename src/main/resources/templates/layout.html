<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <title>Pokemon TCG Collection</title>
    <link rel="icon" type="image/svg+xml" href="/images/pokeball-favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .navbar-brand {
            font-weight: bold;
            color: #ff6b35 !important;
        }
        .card-img-top {
            height: 200px;
            object-fit: contain;
        }
        .zoom-hover-image {
            cursor: zoom-in;
        }
        .pokemon-card {
            transition: transform 0.2s;
        }
        .pokemon-card:hover {
            transform: scale(1.05);
        }
        .owned-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #28a745;
            color: white;
            border-radius: 999px;
            min-width: 30px;
            height: 30px;
            padding: 0 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        .compact-pagination .pagination {
            flex-wrap: wrap;
            gap: 0.25rem;
        }
        .compact-pagination .page-link {
            min-width: 2.35rem;
            padding: 0.45rem 0.7rem;
            text-align: center;
        }
        .page-jump-form {
            align-items: center;
        }
        .page-jump-label {
            margin-bottom: 0;
            white-space: nowrap;
        }
        .page-jump-input {
            width: 5.25rem;
        }
        .mobile-stack-md {
            display: flex;
        }
        .mobile-inline-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .mobile-inline-actions > * {
            flex: 0 0 auto;
        }
        .card-zoom-preview {
            position: fixed;
            z-index: 1085;
            display: none;
            pointer-events: none;
            width: 320px;
            max-width: 28vw;
            border-radius: 18px;
            background: rgba(17, 24, 39, 0.96);
            box-shadow: 0 18px 48px rgba(15, 23, 42, 0.35);
            padding: 12px;
            backdrop-filter: blur(6px);
        }
        .card-zoom-preview img {
            width: 100%;
            display: block;
            border-radius: 12px;
            object-fit: contain;
            background: linear-gradient(180deg, rgba(255,255,255,0.92), rgba(226,232,240,0.92));
        }
        .card-zoom-preview-title {
            color: #f8fafc;
            font-size: 0.9rem;
            margin-top: 10px;
            text-align: center;
        }
        .card-zoom-modal {
            position: fixed;
            inset: 0;
            z-index: 1090;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(8px);
        }
        .card-zoom-modal.is-open {
            display: flex;
        }
        .card-zoom-modal-dialog {
            position: relative;
            width: min(460px, 92vw);
            max-height: calc(100vh - 32px);
            border-radius: 22px;
            background: linear-gradient(180deg, rgba(15,23,42,0.98), rgba(30,41,59,0.98));
            box-shadow: 0 28px 80px rgba(15, 23, 42, 0.45);
            padding: 56px 18px 18px;
            overflow-y: auto;
        }
        .card-zoom-modal-close {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 3;
            border: 0;
            width: 38px;
            height: 38px;
            border-radius: 999px;
            background: rgba(255,255,255,0.14);
            color: #f8fafc;
            font-size: 1.1rem;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.28);
        }
        .card-zoom-modal-image {
            width: 100%;
            max-height: min(56vh, 700px);
            object-fit: contain;
            border-radius: 16px;
            background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(226,232,240,0.96));
        }
        .card-zoom-modal-media {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
            padding: 0 12px;
        }
        .card-zoom-modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            width: 42px;
            height: 42px;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.72);
            color: #f8fafc;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.3);
        }
        .card-zoom-modal-nav.prev {
            left: -10px;
        }
        .card-zoom-modal-nav.next {
            right: -10px;
        }
        .card-zoom-modal-title {
            color: #f8fafc;
            text-align: center;
            margin-top: 12px;
            font-size: 0.98rem;
        }
        .card-zoom-modal-subtitle {
            color: rgba(226, 232, 240, 0.8);
            text-align: center;
            margin-top: 4px;
            font-size: 0.9rem;
        }
        .card-zoom-modal-meta {
            display: grid;
            gap: 0.45rem;
            margin-top: 14px;
        }
        .card-zoom-modal-meta-item {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            color: #e2e8f0;
            font-size: 0.92rem;
            padding: 0.45rem 0.65rem;
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            background: rgba(51, 65, 85, 0.28);
        }
        .card-zoom-modal-meta-label {
            color: rgba(226, 232, 240, 0.72);
        }
        .card-zoom-modal-actions {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 14px;
        }
        .card-zoom-modal-link {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.65rem 0.95rem;
            border-radius: 999px;
            text-decoration: none;
            background: #ef4444;
            color: #fff;
            font-weight: 600;
        }
        .card-zoom-modal-link:hover {
            color: #fff;
            background: #dc2626;
        }
        @media (max-width: 576px) {
            .card-zoom-modal {
                padding: 12px;
            }
            .card-zoom-modal-dialog {
                width: 100%;
                max-height: calc(100vh - 24px);
                padding: 52px 14px 16px;
            }
            .card-zoom-modal-image {
                max-height: 46vh;
            }
            .card-zoom-modal-media {
                padding: 0 6px;
            }
            .compact-pagination .pagination {
                justify-content: center;
            }
            .compact-pagination .page-link {
                min-width: 2rem;
                padding: 0.35rem 0.55rem;
                font-size: 0.9rem;
            }
            .compact-pagination .page-item:first-child .page-link,
            .compact-pagination .page-item:last-child .page-link {
                padding-left: 0.6rem;
                padding-right: 0.6rem;
            }
            .page-jump-form {
                row-gap: 0.5rem;
            }
            .page-jump-label {
                font-size: 0.9rem;
            }
            .page-jump-input {
                width: 4.5rem;
            }
            .page-jump-button {
                padding-left: 0.75rem;
                padding-right: 0.75rem;
            }
            .card-zoom-modal-nav.prev {
                left: 0;
            }
            .card-zoom-modal-nav.next {
                right: 0;
            }
        }
        @media (max-width: 767.98px) {
            .mobile-stack-md {
                flex-direction: column !important;
                align-items: stretch !important;
            }
            .mobile-stack-md > .mobile-stack-item,
            .mobile-stack-md > * {
                width: 100%;
            }
            .mobile-inline-actions {
                width: 100%;
            }
            .mobile-inline-actions > * {
                flex: 1 1 100%;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-dragon"></i> Pokemon TCG Collection
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">
                            <i class="fas fa-house"></i> Accueil
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/browse">
                            <i class="fas fa-search"></i> Parcourir
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/sets">
                            <i class="fas fa-cubes"></i> Ensembles
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" href="/collection">
                            <i class="fas fa-book"></i> Ma Collection
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" href="/pokedex">
                            <i class="fas fa-list"></i> Pokedex
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" href="/dashboard">
                            <i class="fas fa-tachometer-alt"></i> Dashboard
                        </a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link" href="/login">Connexion</a>
                    </li>
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link" href="/register">Inscription</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <form class="d-inline" th:action="@{/logout}" method="post">
                            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-link nav-link">
                                <i class="fas fa-sign-out-alt"></i> Déconnexion
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4" layout:fragment="content">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        function withCsrf(init) {
            const requestInit = init ? { ...init } : {};
            const token = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
            const headerName = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');
            const headers = new Headers(requestInit.headers || {});

            if (token && headerName && !headers.has(headerName)) {
                headers.set(headerName, token);
            }

            requestInit.headers = headers;
            if (!requestInit.credentials) {
                requestInit.credentials = 'same-origin';
            }
            return requestInit;
        }

        (() => {
            let zoomModal = null;
            let zoomDialog = null;
            let zoomImage = null;
            let zoomTitle = null;
            let zoomSubtitle = null;
            let zoomMeta = null;
            let zoomPrevButton = null;
            let zoomNextButton = null;
            let activeSelector = null;
            let activeImages = [];
            let activeIndex = -1;

            function ensureZoomModal() {
                if (zoomModal) {
                    return;
                }

                zoomModal = document.createElement('div');
                zoomModal.className = 'card-zoom-modal';
                zoomModal.innerHTML = '' +
                    '<div class="card-zoom-modal-dialog" role="dialog" aria-modal="true" aria-label="Zoom carte">' +
                    '<button type="button" class="card-zoom-modal-close" aria-label="Fermer">&times;</button>' +
                    '<div class="card-zoom-modal-media">' +
                    '<button type="button" class="card-zoom-modal-nav prev" aria-label="Carte precedente"><i class="fas fa-chevron-left"></i></button>' +
                    '<img class="card-zoom-modal-image" alt="">' +
                    '<button type="button" class="card-zoom-modal-nav next" aria-label="Carte suivante"><i class="fas fa-chevron-right"></i></button>' +
                    '</div>' +
                    '<div class="card-zoom-modal-title"></div>' +
                    '<div class="card-zoom-modal-subtitle"></div>' +
                    '<div class="card-zoom-modal-meta"></div>' +
                    '</div>';
                document.body.appendChild(zoomModal);

                zoomDialog = zoomModal.querySelector('.card-zoom-modal-dialog');
                zoomImage = zoomModal.querySelector('.card-zoom-modal-image');
                zoomTitle = zoomModal.querySelector('.card-zoom-modal-title');
                zoomSubtitle = zoomModal.querySelector('.card-zoom-modal-subtitle');
                zoomMeta = zoomModal.querySelector('.card-zoom-modal-meta');
                zoomPrevButton = zoomModal.querySelector('.card-zoom-modal-nav.prev');
                zoomNextButton = zoomModal.querySelector('.card-zoom-modal-nav.next');

                zoomModal.querySelector('.card-zoom-modal-close').addEventListener('click', closeCardZoomModal);
                zoomPrevButton.addEventListener('click', () => moveCardZoom(-1));
                zoomNextButton.addEventListener('click', () => moveCardZoom(1));
                zoomModal.addEventListener('click', event => {
                    if (!zoomDialog.contains(event.target) || event.target === zoomModal) {
                        closeCardZoomModal();
                    }
                });

                document.addEventListener('keydown', event => {
                    if (!zoomModal.classList.contains('is-open')) {
                        return;
                    }
                    if (event.key === 'Escape') {
                        closeCardZoomModal();
                    } else if (event.key === 'ArrowLeft') {
                        moveCardZoom(-1);
                    } else if (event.key === 'ArrowRight') {
                        moveCardZoom(1);
                    }
                });
            }

            function getVisibleImages(selector) {
                return Array.from(document.querySelectorAll(selector))
                    .filter(image => image.offsetParent !== null);
            }

            function buildMetaItem(label, value) {
                if (!value) {
                    return '';
                }
                const safeLabel = String(label)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');
                const safeValue = String(value)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');
                return '<div class="card-zoom-modal-meta-item"><span class="card-zoom-modal-meta-label">'
                    + safeLabel
                    + '</span><span>'
                    + safeValue
                    + '</span></div>';
            }

            function updateCardZoomModal(image) {
                const dataset = image.dataset;
                zoomImage.src = dataset.zoomSrc || image.src;
                zoomImage.alt = image.alt || '';
                zoomTitle.textContent = dataset.zoomTitle || image.alt || '';
                zoomSubtitle.textContent = dataset.zoomSubtitle || '';
                zoomSubtitle.style.display = zoomSubtitle.textContent ? '' : 'none';

                zoomMeta.innerHTML = [
                    buildMetaItem('Carte', dataset.zoomCardId),
                    buildMetaItem('Numero local', dataset.zoomLocalId),
                    buildMetaItem('Set', dataset.zoomSetName),
                    buildMetaItem('Rareté', dataset.zoomRarity),
                    buildMetaItem('Forme', dataset.zoomVariant),
                    buildMetaItem('Quantité', dataset.zoomQuantity)
                ].join('');

                zoomPrevButton.style.display = activeIndex > 0 ? '' : 'none';
                zoomNextButton.style.display = activeIndex < activeImages.length - 1 ? '' : 'none';
            }

            function openCardZoomModal(selector, image) {
                ensureZoomModal();
                activeSelector = selector;
                activeImages = getVisibleImages(selector);
                activeIndex = activeImages.indexOf(image);
                if (activeIndex < 0) {
                    activeImages = Array.from(document.querySelectorAll(selector));
                    activeIndex = activeImages.indexOf(image);
                }
                updateCardZoomModal(image);
                zoomModal.classList.add('is-open');
                document.body.classList.add('overflow-hidden');
            }

            function moveCardZoom(direction) {
                if (!activeImages.length) {
                    return;
                }
                const nextIndex = activeIndex + direction;
                if (nextIndex < 0 || nextIndex >= activeImages.length) {
                    return;
                }
                activeIndex = nextIndex;
                updateCardZoomModal(activeImages[activeIndex]);
            }

            function closeCardZoomModal() {
                if (!zoomModal) {
                    return;
                }
                zoomModal.classList.remove('is-open');
                document.body.classList.remove('overflow-hidden');
                zoomImage.src = '';
            }

            function setupClickZoom(selector) {
                const images = document.querySelectorAll(selector);
                if (!images.length) {
                    return;
                }

                images.forEach(image => {
                    if (image.dataset.zoomClickBound === 'true') {
                        return;
                    }
                    image.dataset.zoomClickBound = 'true';
                    image.addEventListener('click', () => openCardZoomModal(selector, image));
                });
            }

            window.initializeCardZoom = function(selector) {
                setupClickZoom(selector);
            };
        })();
    </script>
    <th:block layout:fragment="scripts"></th:block>
</body>
</html>
