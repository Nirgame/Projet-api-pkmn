<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Parcourir les cartes - Pokemon TCG Collection</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="row mb-4">
            <div class="col-12">
                <h1><i class="fas fa-search"></i> Parcourir les cartes</h1>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-12">
                <form id="browse-filter-form" class="row g-2 align-items-end" th:action="@{/browse}" method="get">
                    <div class="col-lg-5">
                        <label class="form-label" for="browseSearch">Recherche</label>
                        <input id="browseSearch" class="form-control" type="search" name="search"
                               th:value="${search}" placeholder="Rechercher une carte en francais ou en anglais..." aria-label="Search">
                    </div>
                    <div class="col-lg-3">
                        <label class="form-label" for="browseSet">Set</label>
                        <select id="browseSet" class="form-select" name="setId">
                            <option value="">Tous les sets</option>
                            <option th:each="setOption : ${setOptions}"
                                    th:value="${setOption.id}"
                                    th:text="${setOption.displayName}"
                                    th:selected="${setId != null and setId == setOption.id}">
                                Set de Base
                            </option>
                        </select>
                    </div>
                    <div class="col-lg-3">
                        <label class="form-label" for="browseRarity">Rareté</label>
                        <select id="browseRarity" class="form-select" name="rarity">
                            <option value="">Toutes les raretés</option>
                            <option th:each="rarityOption : ${rarityOptions}"
                                    th:value="${rarityOption}"
                                    th:text="${rarityOption}"
                                    th:selected="${rarity != null and rarity == rarityOption}">
                                Peu Commune
                            </option>
                        </select>
                    </div>
                    <div class="col-lg-2 d-grid">
                        <button class="btn btn-outline-primary" type="submit">
                            <i class="fas fa-search"></i> Rechercher
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div th:if="${error}" class="alert alert-warning">
            <i class="fas fa-exclamation-triangle"></i> <span th:text="${error}">Erreur</span>
        </div>

        <div th:if="${cards != null}">
            <div class="alert alert-info" th:if="${cards.isEmpty()}">
                <i class="fas fa-info-circle"></i> Aucune carte trouvee pour ce filtre.
            </div>
            <div class="row" th:if="${!cards.isEmpty()}">
                <div class="col-6 col-lg-4 col-xl-3 mb-4" th:each="card : ${cards}">
                    <div class="card pokemon-card h-100 position-relative">
                        <div class="owned-badge"
                             th:id="|owned-badge-${card.id}|"
                             th:style="${ownedCardCounts != null and ownedCardCounts.containsKey(card.id) ? '' : 'display: none;'}"
                             th:text="${ownedCardCounts != null and ownedCardCounts.containsKey(card.id) ? ownedCardCounts.get(card.id) : 0}">
                            0
                        </div>
                        <img th:src="${card.displayImage}"
                             th:alt="${card.displayName}" class="card-img-top zoom-hover-image"
                             th:attr="data-zoom-src=${card.displayImage},
                                      data-zoom-title=${card.displayName},
                                      data-zoom-subtitle=${card.secondaryName},
                                      data-zoom-card-id=${card.id},
                                      data-zoom-local-id=${card.localId},
                                      data-zoom-set-name=${card.displaySetName},
                                      data-zoom-rarity=${card.displayRarity},
                                      data-zoom-variant=${card.variantLabel},
                                      data-zoom-owned-count=${ownedCardCounts != null and ownedCardCounts.containsKey(card.id) ? ownedCardCounts.get(card.id) : 0},
                                      data-zoom-can-add=${authenticated},
                                      data-zoom-can-remove=${authenticated and ownedCardCounts != null and ownedCardCounts.containsKey(card.id)}"
                             onerror="this.onerror=null;this.src='/images/placeholder.svg'">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start gap-2 mb-2">
                                <div>
                                    <h6 class="card-title mb-1" th:text="${card.displayName}">Card Name</h6>
                                    <p class="card-text text-muted small mb-0"
                                       th:if="${card.secondaryName != null}"
                                       th:text="${card.secondaryName}">
                                        English name
                                    </p>
                                </div>
                                <span class="badge bg-light text-dark border"
                                      th:if="${card.variantLabel != null}"
                                      th:text="${card.variantLabel}">
                                    Alola
                                </span>
                            </div>
                            <div class="d-flex flex-wrap gap-1 mb-2">
                                <span class="badge bg-secondary-subtle text-dark border"
                                      th:if="${card.hasRarity()}"
                                      th:text="${card.displayRarity}">
                                    Peu Commune
                                </span>
                            </div>
                            <p class="card-text text-muted small" th:text="${card.id}">card-id</p>
                            <div class="d-flex justify-content-between align-items-center">
                                <small class="text-muted" th:text="${card.localId}">Local ID</small>
                                <button class="btn btn-sm btn-success add-to-collection-btn"
                                        th:attr="data-card-id=${card.id}">
                                    <i class="fas fa-plus"></i> Ajouter
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row compact-pagination" th:if="${totalPages > 1}">
            <div class="col-12">
                <nav aria-label="Page navigation">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                            <a class="page-link" th:href="@{/browse(page=${currentPage - 1}, search=${search}, setId=${setId}, rarity=${rarity})}">Precedent</a>
                        </li>
                        <th:block th:each="pageNumber : ${pageNumbers}">
                            <li class="page-item disabled" th:if="${pageNumber == null}">
                                <span class="page-link">...</span>
                            </li>
                            <li class="page-item" th:if="${pageNumber != null}"
                                th:classappend="${pageNumber == currentPage} ? 'active'">
                                <a class="page-link"
                                   th:href="@{/browse(page=${pageNumber}, search=${search}, setId=${setId}, rarity=${rarity})}"
                                   th:text="${pageNumber}">1</a>
                            </li>
                        </th:block>
                        <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                            <a class="page-link" th:href="@{/browse(page=${currentPage + 1}, search=${search}, setId=${setId}, rarity=${rarity})}">Suivant</a>
                        </li>
                    </ul>
                </nav>
                <form class="row g-2 justify-content-center mt-3 page-jump-form" method="get" th:action="@{/browse}">
                    <input type="hidden" name="search" th:value="${search}">
                    <input type="hidden" name="setId" th:value="${setId}">
                    <input type="hidden" name="rarity" th:value="${rarity}">
                    <div class="col-auto">
                        <label class="col-form-label page-jump-label" for="browsePageJump">Page</label>
                    </div>
                    <div class="col-auto">
                        <input id="browsePageJump"
                               class="form-control page-jump-input"
                               type="number"
                               name="page"
                               min="1"
                               th:attr="max=${totalPages}"
                               th:value="${currentPage}">
                    </div>
                    <div class="col-auto">
                        <button class="btn btn-outline-secondary page-jump-button" type="submit">OK</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div layout:fragment="scripts">
        <script>
            function setButtonLoading(button, loading) {
                button.innerHTML = loading
                    ? '<i class="fas fa-spinner fa-spin"></i>'
                    : '<i class="fas fa-plus"></i> Ajouter';
                button.disabled = loading;
            }

            function updateOwnedBadge(cardId, quantity) {
                const badge = document.getElementById('owned-badge-' + cardId);
                if (!badge) {
                    return;
                }

                badge.style.display = 'flex';
                badge.textContent = String(quantity);
            }

            function addToCollection(cardId, button) {
                setButtonLoading(button, true);

                fetch('/api/collection/cards/' + cardId, withCsrf({
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'same-origin'
                }))
                .then(response => {
                    if (response.redirected) {
                        window.location.href = response.url;
                        return null;
                    }
                    if (response.status === 401 || response.status === 403) {
                        window.location.href = '/login';
                        return null;
                    }
                    return response.json();
                })
                .then(data => {
                    if (!data) return;
                    if (data.success) {
                        const quantity = data.card && data.card.quantity ? data.card.quantity : 1;
                        updateOwnedBadge(cardId, quantity);
                        setButtonLoading(button, false);
                    } else {
                        setButtonLoading(button, false);
                        alert('Erreur: ' + data.error);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    setButtonLoading(button, false);
                    alert('Erreur lors de l ajout a la collection');
                });
            }

            document.addEventListener('DOMContentLoaded', function() {
                initializeCardZoom('.zoom-hover-image');
                document.querySelectorAll('.add-to-collection-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const cardId = this.getAttribute('data-card-id');
                        addToCollection(cardId, this);
                    });
                });
            });
        </script>
    </div>
</body>
</html>
