<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="${@displayText.ui('register') + ' - Pokemon TCG Collection'}">Inscription - Pokemon TCG Collection</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header text-center">
                        <h4><i class="fas fa-user-plus"></i> <span th:text="${@displayText.ui('create_account')}">Creer un compte</span></h4>
                    </div>
                    <div class="card-body">
                        <div th:if="${error}" class="alert alert-danger">
                            <i class="fas fa-exclamation-triangle"></i> <span th:text="${error}">Erreur</span>
                        </div>
                        <div th:if="${success}" class="alert alert-success">
                            <i class="fas fa-check"></i> <span th:text="${success}">Succes</span>
                        </div>

                        <form th:action="@{/register}" method="post">
                            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <div class="mb-3">
                                <label for="username" class="form-label" th:text="${@displayText.text('Nom d''utilisateur *', 'Username *')}">Nom d'utilisateur *</label>
                                <input type="text" class="form-control" id="username" name="username" required minlength="3" maxlength="50">
                                <div class="form-text" th:text="${@displayText.text('3 à 50 caractères', '3 to 50 characters')}">3 a 50 caracteres</div>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label" th:text="${@displayText.text('Mot de passe *', 'Password *')}">Mot de passe *</label>
                                <input type="password" class="form-control" id="password" name="password" required minlength="6" maxlength="100">
                                <div class="form-text" th:text="${@displayText.text('Au moins 6 caractères', 'At least 6 characters')}">Au moins 6 caracteres</div>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-success">
                                    <i class="fas fa-user-plus"></i> <span th:text="${@displayText.text('Créer mon compte', 'Create my account')}">Creer mon compte</span>
                                </button>
                            </div>
                        </form>
                    </div>
                    <div class="card-footer text-center">
                        <p class="mb-0">
                            <span th:text="${@displayText.text('Déjà un compte ?', 'Already have an account?')}">Deja un compte ?</span>
                            <a href="/login" class="text-decoration-none" th:text="${@displayText.text('Se connecter', 'Sign in')}">Se connecter</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
