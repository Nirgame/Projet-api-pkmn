# Local development database configuration
spring.datasource.url=jdbc:h2:file:./data/pokemon_tcg_db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${APP_DB_PASSWORD:pokemon_tcg_local}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (opt-in for development)
spring.h2.console.enabled=${APP_H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

